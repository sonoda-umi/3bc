[project]
name = "3BC"
version = "0.1.0"
description = "Implementation of 3BC and 3BCx benchmark problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Direct dependencies ---
    "fastapi==0.116.1",
    "fastapi-cli==0.0.8",
    "fastapi-cloud-cli==0.1.5",
    "flask==2.3.3",
    "gunicorn==20.1.0",
    "igraph==0.10.3",
    "ipykernel>=7.2.0",
    "jmetalpy==1.5.5",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "matplotlib==3.6.2",
    "mlflow==2.1.1",
    "nbformat>=5.10.4",
    "networkx==2.8.8",
    "numba==0.60.0",
    "numpy<2.0.0",
    "pandas==1.5.3",
    "plotly==6.2.0",
    "polars>=1.40.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pyyaml==6.0.2",
    "rich==14.1.0",
    "ruff>=0.14.14",
    "scikit-learn==1.7.1",
    "scipy==1.15.3",
    "setuptools<82.0.0", # Avoid setuptools 82.0.0+ which breaks mlflow
    "shap==0.48.0",
    "statsmodels==0.14.5",
    "tqdm==4.66.4",
    "typer==0.16.0",
    "uvicorn==0.35.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 128
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F", "E501", "I", "W"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
docstring-code-format = true
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pyright]
include = [".", "test"]
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
]
